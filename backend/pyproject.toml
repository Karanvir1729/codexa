[project]
name = "voice-agent-feedback-engine"
version = "0.1.0"
description = "NVIDIA-backed voice agent runtime with continuous eval feedback."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "loguru>=0.7.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "twilio>=9.3.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
voice-cloud = [
  "pipecat-ai[websocket,webrtc,openai,nvidia,deepgram,cartesia,google,whisper,kokoro,piper]>=1.2.1",
  "ormsgpack>=1.7.0",
]
voice = [
  "pipecat-ai[websocket,webrtc,openai,nvidia,deepgram,cartesia,local,mlx-whisper,kokoro,piper,whisper]>=1.2.1",
  "ormsgpack>=1.7.0",
  "whisperx>=3.8.5",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
