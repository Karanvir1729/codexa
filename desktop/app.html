<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codexa</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <aside class="rail">
        <header class="brand">
          <div class="mark">⌘</div>
          <div>
            <h1>Codexa</h1>
            <p id="connectionLabel">Off</p>
          </div>
        </header>

        <button id="enableBtn" class="enable">Enable</button>
        <button id="linkCodexBtn" class="ghost">Link Codex</button>
        <button id="permissionsBtn" class="ghost">Permissions</button>
        <button id="newChatBtn" class="ghost">New chat</button>

        <section id="projectList" class="projects" aria-label="Chats"></section>
      </aside>

      <section class="main">
        <header class="topbar">
          <h2 id="chatTitle">Pick chat.</h2>
          <div class="actions">
            <button id="statusBtn" class="icon" title="Computer status">Status</button>
            <button id="openCodexBtn" class="icon" title="Open Codex">Codex</button>
            <button id="infoBtn" class="info" aria-label="Info">i</button>
          </div>
        </header>

        <section id="messages" class="messages" aria-label="Chat record"></section>

        <footer class="composer">
          <input id="input" autocomplete="off" placeholder="Message Codexa..." />
          <button id="sendBtn" class="send" aria-label="Send">↵</button>
        </footer>
      </section>
    </main>

    <dialog id="infoDialog">
      <button id="closeInfoBtn" class="close" aria-label="Close">×</button>
      <p>Enable starts Codexa's local bridge. Link Codex creates a Codex app chat in this project. Permissions opens macOS privacy panes for OpenClaw-style computer control.</p>
    </dialog>

    <dialog id="permissionsDialog">
      <button id="closePermissionsBtn" class="close" aria-label="Close">×</button>
      <div class="permission-grid">
        <button data-permission="accessibility">Accessibility</button>
        <button data-permission="automation">Automation</button>
        <button data-permission="fullDisk">Full Disk</button>
        <button data-permission="microphone">Microphone</button>
      </div>
    </dialog>

    <script src="./renderer.js"></script>
  </body>
</html>
