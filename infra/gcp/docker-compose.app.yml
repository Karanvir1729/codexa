services:
  backend:
    build:
      context: ../..
      dockerfile: infra/gcp/Dockerfile.backend-voice
    env_file:
      - ../../.env
    ports:
      - "8000:8000"
    volumes:
      - ../../data:/app/data

  frontend:
    build:
      context: ../..
      dockerfile: infra/gcp/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
